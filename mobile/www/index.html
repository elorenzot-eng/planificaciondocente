<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082f6d">
  <title>EducAntay</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f6f8;color:#082f6d;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,430px);background:white;border-radius:24px;padding:36px 24px;text-align:center;box-shadow:0 14px 45px rgba(8,47,109,.12)}
    .mark{width:88px;height:88px;margin:auto;border-radius:24px;background:#082f6d;color:white;display:grid;place-items:center;font-size:30px;font-weight:800}
    h1{font-size:34px;margin:20px 0 8px}.accent{color:#079ddd}p{color:#617087;line-height:1.5}.ok{margin-top:28px;padding:16px;border-radius:14px;background:#eef8f2;color:#24713c;font-weight:700}
  </style>
</head>
<body>
<main>
  <div class="mark">EA</div>
  <h1>Educ<span class="accent">Antay</span></h1>
  <p>Aplicación móvil</p>
  <div class="ok">✓ EducAntay inició correctamente</div>
</main>
</body>
</html>
