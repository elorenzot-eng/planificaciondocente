<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0B2D4A" />
  <link rel="stylesheet" href="./styles.css" />
  <title>EducAntay</title>
</head>
<body>
  <main id="app" class="shell">
    <section id="loginView" class="auth-card">
      <div class="brand">
        <span class="brand-mark">EA</span>
        <div><strong>EducAntay</strong><small>Tu asistente docente con IA</small></div>
      </div>
      <h1>Bienvenido</h1>
      <p class="muted">Ingresa con la misma cuenta que utilizas en educantay.cl.</p>
      <form id="loginForm">
        <label>Correo electrónico<input id="email" type="email" autocomplete="email" required /></label>
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" required /></label>
        <button id="loginButton" type="submit">Ingresar</button>
      </form>
      <button id="forgotButton" class="link-button" type="button">Olvidé mi contraseña</button>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="homeView" class="home hidden">
      <header>
        <div class="brand"><span class="brand-mark">EA</span><strong>EducAntay</strong></div>
        <button id="logoutButton" class="ghost">Salir</button>
      </header>
      <div class="welcome">
        <p>Hola,</p><h1 id="userName">Docente</h1>
        <span id="accountType" class="pill"></span>
      </div>
      <div class="grid">
        <button data-route="/planificacion-docente-ia">📝<strong>Planificación IA</strong><span>Planifica tus clases</span></button>
        <button data-route="/evaluaciones-con-ia">✓<strong>Evaluaciones IA</strong><span>Crea instrumentos</span></button>
        <button data-route="/material-educativo-ia">✨<strong>Material IA</strong><span>Genera recursos</span></button>
        <button data-route="/?panel=mi-carpeta">📁<strong>Mi Carpeta</strong><span>Revisa tus archivos</span></button>
        <button data-route="/?panel=suscripcion">💳<strong>Mi Suscripción</strong><span>Plan y generaciones</span></button>
        <button data-route="/?panel=soporte">💬<strong>Soporte</strong><span>Ayuda y tickets</span></button>
      </div>
    </section>
    <section id="planningView" class="home hidden">
      <header><button id="planningBack" class="ghost">← Inicio</button><strong>Planificación IA</strong></header>
      <div class="welcome"><h1>Nueva planificación</h1><p class="muted">Currículum EducAntay · Clase a clase</p></div>
      <form id="planningForm" class="planner-form">
        <label>Curso<select id="courseSelect" required></select></label>
        <label>Asignatura<select id="subjectSelect" required></select></label>
        <label>Unidad<select id="unitSelect"><option value="">Sin unidad seleccionada</option></select></label>
        <fieldset><legend>Objetivos de Aprendizaje</legend><div id="objectivesList" class="oa-list"></div></fieldset>
        <label>Duración<select id="durationSelect"><option>45 minutos</option><option selected>90 minutos</option><option>135 minutos</option><option>180 minutos</option></select></label>
        <label>Indicaciones adicionales<textarea id="instructions" rows="4" placeholder="Ej.: incorporar trabajo colaborativo..."></textarea></label>
        <label class="check"><input id="adaptations" type="checkbox"/> Incluir adecuaciones curriculares</label>
        <button id="generateButton" type="submit">Generar planificación con IA</button>
      </form>
      <div id="planningLoader" class="loader-box hidden"><div class="spinner"></div><strong>Generando con IA…</strong><span>Estamos preparando tu planificación.</span></div>
      <p id="planningMessage" class="message" aria-live="polite"></p>
      <article id="planningResult" class="result hidden"></article>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
