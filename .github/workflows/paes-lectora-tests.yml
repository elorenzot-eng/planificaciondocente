name: PAES Competencia Lectora regression tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/paes/**'
      - 'scripts/paes-print-samples.ts'
      - '.github/workflows/paes-lectora-tests.yml'
  push:
    branches: [feature/paes-lectora-validation]
    paths:
      - 'lib/paes/**'
      - '.github/workflows/paes-lectora-tests.yml'
jobs:
  lectora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript test runner
        run: npm install --no-save --no-audit --no-fund tsx
      - name: Run PAES Lectora regression checks
        run: npx tsx -e "import { testLectoraPipeline } from './lib/paes/lectora.test.ts'; testLectoraPipeline(); console.log('PAES Lectora regression tests passed');"
      - name: Create printable HTML samples
        run: npx tsx scripts/paes-print-samples.ts
      - name: Upload print samples for inspection
        uses: actions/upload-artifact@v4
        with:
          name: paes-lectora-print-samples
          path: artifacts/paes-lectora/*.html
          retention-days: 7
