name: PAES Competencia Lectora regression tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/paes/**'
      - 'app/api/paes/lectora/pilot/**'
      - 'scripts/paes-print-samples.ts'
      - 'scripts/paes-65-synthetic-validation.ts'
      - '.github/workflows/paes-lectora-tests.yml'
  push:
    branches: [feature/paes-lectora-validation]
    paths:
      - 'lib/paes/**'
      - '.github/workflows/paes-lectora-tests.yml'
jobs:
  lectora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript test runner
        run: npm install --no-save --no-audit --no-fund tsx
      - name: Run PAES Lectora regression checks
        run: npx tsx -e "import { testLectoraPipeline, testLectoraCompleteOrchestration } from './lib/paes/lectora.test.ts'; testLectoraPipeline(); testLectoraCompleteOrchestration().then(() => ('PAES Lectora regression tests passed')).catch(e => { console.error(e); process.exit(1); });"
      - name: Create printable HTML samples
        run: npx tsx scripts/paes-print-samples.ts
      - name: Upload print samples for inspection
        uses: actions/upload-artifact@v4
        with:
          name: paes-lectora-print-samples
          path: artifacts/paes-lectora/*.html
          retention-days: 7
      - name: Validate 65-question synthetic exam and print layouts
        run: npx tsx scripts/paes-65-synthetic-validation.ts
      - name: Upload 65-question print samples
        uses: actions/upload-artifact@v4
        with:
          name: paes-lectora-65-synthetic
          path: artifacts/paes-lectora-65/*.html
          retention-days: 7
