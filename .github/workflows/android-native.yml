name: EducAntay Native Android

on:
  workflow_dispatch:
  push:
    branches: [feature/educantay-android]
    paths:
      - "native-android/**"
      - ".github/workflows/android-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build native debug APK
        run: gradle assembleDebug
      - name: Validate APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: educantay-native-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
