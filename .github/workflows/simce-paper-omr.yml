name: SIMCE paper OMR tests
on:
  pull_request:
    paths:
      - 'lib/simce-paper-*.ts'
      - 'tests/simce-paper-omr.test.cjs'
      - 'package.json'
      - '.github/workflows/simce-paper-omr.yml'
  push:
    branches:
      - feature/simce-corrector-papel
jobs:
  omr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:simce
