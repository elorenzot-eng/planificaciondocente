name: Recursos IA - PostgreSQL migration check
on:
  pull_request:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/manual-migrations/**'
      - '.github/workflows/recursos-ia-db-check.yml'
  workflow_dispatch:
jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: educantay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d educantay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/educantay_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply current production schema (main) to isolated DB
        run: |
          cp prisma/schema.prisma /tmp/feature-schema.prisma
          git show origin/main:prisma/schema.prisma > prisma/schema.prisma
          npx prisma validate
          npx prisma db push --skip-generate
          cp /tmp/feature-schema.prisma prisma/schema.prisma
      - name: Validate additive migration and preserve existing schema
        run: |
          npx prisma validate
          npx prisma db push --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='LearningResource'" | grep -qx 1
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='LearningResource' AND column_name='content' AND data_type='jsonb'" | grep -qx 1
          npx prisma db push --skip-generate
      - name: Check SQL script on separate clean baseline
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE "LearningResource" CASCADE'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/manual-migrations/20261020_learning_resource.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='LearningResource'" | grep -qx 1
          npx prisma db push --skip-generate
