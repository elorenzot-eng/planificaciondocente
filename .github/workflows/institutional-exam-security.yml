name: Institutional exam security checks
on:
  pull_request:
    paths:
      - 'lib/institutional-exam-*.ts'
      - 'tests/institutional-exam-*.test.cjs'
      - 'package.json'
      - '.github/workflows/institutional-exam-security.yml'
  workflow_dispatch:

jobs:
  institutional-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:institutional
