name: Build EducAntay Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "ANDROID_RELEASE_TRIGGER"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure EducAntay v1.0 Android identity
        run: |
          sed -i 's/versionName "1.0"/versionName "1.0.0"/' android/app/build.gradle
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/>planificaciondocente</>EducAntay</g' android/app/src/main/res/values/strings.xml
          fi

      - name: Restore production keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/educantay-release.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          prod = Path("android/app/educantay-release.jks").exists()
          if prod:
              marker = "buildTypes {"
              signing = """signingConfigs {
        release {
            storeFile file("educantay-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    """
              s = s.replace(marker, signing + marker, 1)
              s = s.replace("release {\n            minifyEnabled", "release {\n            signingConfig signingConfigs.release\n            minifyEnabled", 1)
          else:
              s = s.replace("release {\n            minifyEnabled", "release {\n            signingConfig signingConfigs.debug\n            minifyEnabled", 1)
          p.write_text(s)
          print("Production signing enabled" if prod else "Production secrets absent: test signing enabled")
          PY

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EducAntay-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: EducAntay-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
