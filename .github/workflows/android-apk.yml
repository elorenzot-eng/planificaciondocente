name: Build EducAntay Android

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure EducAntay v1.0
        run: |
          sed -i 's/versionName "1.0"/versionName "1.0.0"/' android/app/build.gradle
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/>planificaciondocente</>EducAntay</g' android/app/src/main/res/values/strings.xml
          fi

      - name: Restore production keystore
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/educantay-release.jks
          test -s android/app/educantay-release.jks

      - name: Configure production signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "buildTypes {"
          signing = """signingConfigs {
        release {
            storeFile file("educantay-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    """
          if marker not in s:
              raise SystemExit("buildTypes block not found")
          s = s.replace(marker, signing + marker, 1)
          needle = "release {\n            minifyEnabled"
          if needle not in s:
              raise SystemExit("release block not found")
          s = s.replace(needle, "release {\n            signingConfig signingConfigs.release\n            minifyEnabled", 1)
          p.write_text(s)
          PY

      - name: Verify keystore
        run: keytool -list -keystore android/app/educantay-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build production APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: EducAntay-v1.0-production-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: EducAntay-v1.0-production-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
