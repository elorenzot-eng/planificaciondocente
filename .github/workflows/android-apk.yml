name: Build EducAntay Android

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "capacitor.config.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set EducAntay version
        run: |
          sed -i 's/versionName "1.0"/versionName "1.0.0"/' android/app/build.gradle
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/>planificaciondocente</>EducAntay</g' android/app/src/main/res/values/strings.xml
          fi

      - name: Build unsigned release
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EducAntay-v1.0-stage-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: EducAntay-v1.0-stage-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
